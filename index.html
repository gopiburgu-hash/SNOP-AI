<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d18">
  <title>SNOOP AI - Personal Assistant</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,sans-serif;
      background:#090d18;color:#f4f6ff;
      min-height:100vh;
      display:flex;flex-direction:column;
    }
    .app{max-width:900px;margin:auto;min-height:100vh;width:100%;display:flex;flex-direction:column;}
    header{padding:15px;background:#131b2e;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b;}
    header h1{font-size:1.2rem;color:#38bdf8;}
    .header-actions{display:flex;gap:8px;}
    .new-chat{background:#2563eb;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;}
    .timer-btn{background:#7c3aed;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;}
    .chat-container{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;padding-bottom:100px;}
    .welcome{text-align:center;margin-top:30px;}
    .welcome h2{font-size:1.8rem;margin-bottom:8px;color:#38bdf8;}
    .tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
    .tool-card{background:#131b2e;border:1px solid #1e293b;padding:12px 18px;border-radius:8px;cursor:pointer;font-size:0.9rem;transition:0.2s;}
    .tool-card:hover{background:#1e293b;border-color:#38bdf8;}
    .msg{padding:10px 14px;border-radius:8px;max-width:80%;line-height:1.4;word-break:break-word;}
    .msg.user{background:#2563eb;color:white;align-self:flex-end;}
    .msg.ai{background:#1e293b;color:#f4f6ff;align-self:flex-start;border:1px solid #334155;}
    .input-area{position:fixed;bottom:0;left:0;right:0;background:#090d18;padding:15px;max-width:900px;margin:auto;border-top:1px solid #1e293b;display:flex;gap:10px;align-items:center;}
    .input-box{flex:1;background:#131b2e;border:1px solid #334155;color:white;padding:12px;border-radius:8px;font-size:1rem;outline:none;}
    .action{background:#2563eb;color:white;border:none;padding:12px 16px;border-radius:8px;cursor:pointer;font-weight:bold;}
    .action.mic{background:#059669;}
    .timer-widget{background:#1e293b;border:1px solid #7c3aed;padding:10px;border-radius:8px;margin:10px auto;text-align:center;max-width:300px;}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>SNOOP AI</h1>
      <div class="header-actions">
        <button class="timer-btn" onclick="toggleTimer()">⏱️ Timer</button>
        <button class="new-chat" onclick="startNewChat()">+ New Chat</button>
      </div>
    </header>

    <div class="chat-container" id="chat">
      <div id="timer-banner" class="timer-widget" style="display:none;">
        ⏱️ Study Timer: <span id="timer-display" style="font-weight:bold;color:#38bdf8;">25:00</span>
        <button onclick="resetTimer()" style="background:#ef4444;color:white;border:none;padding:2px 8px;border-radius:4px;margin-left:8px;cursor:pointer;">Reset</button>
      </div>

      <div class="welcome" id="welcome">
        <h2>Hello, I'm SNOOP AI</h2>
        <p>Your intelligent study & productivity assistant. Choose a tool or start typing below!</p>
        <div class="tools" id="tools">
          <div class="tool-card" onclick="triggerTool('Study Assistant')">📚 Study Assistant</div>
          <div class="tool-card" onclick="triggerTool('Coding Help')">💻 Coding Help</div>
          <div class="tool-card" onclick="triggerTool('Research')">🔍 Research</div>
          <div class="tool-card" onclick="triggerTool('Writing')">✍️ Writing</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <button class="action mic" onclick="startVoiceInput()" title="Voice Input">🎤</button>
      <input type="text" id="prompt" class="input-box" placeholder="Ask SNOOP AI anything or type a prompt..." />
      <button class="action send" onclick="handleSend()">Send</button>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY="AQ.Ab8RN6J5uBehMUgaCUBl90fx7KpFfX7wMyHGIE3QXhlv0ZajhQ"; // Put your API key here

    const chat = document.getElementById("chat");
    const promptBox = document.getElementById("prompt");
    const welcome = document.getElementById("welcome");
    let messages = JSON.parse(localStorage.getItem("snoop_messages")) || [];

    // Study Timer Logic
    let timerInterval = null;
    let timeLeft = 25 * 60; // 25 mins

    function toggleTimer() {
      const banner = document.getElementById("timer-banner");
      banner.style.display = "block";
      
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      } else {
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById("timer-display").textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
          } else {
            clearInterval(timerInterval);
            alert("Study session finished! Take a short break! ☕");
            timeLeft = 25 * 60;
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timeLeft = 25 * 60;
      document.getElementById("timer-display").textContent = "25:00";
    }

    function render() {
      if (!chat) return;
      const msgs = chat.querySelectorAll(".msg");
      msgs.forEach(m => m.remove());
      messages.forEach(m => appendMessageToUI(m.text, m.role, false));
      if (welcome) welcome.style.display = messages.length ? "none" : "block";
    }

    async function sendToSnoopAI(userPrompt) {
      if (GEMINI_API_KEY.includes("YOUR_")) {
        return "Please insert your Gemini API key inside the script code!";
      }
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      
      const contents = messages.map(msg => ({
        role: msg.role === "user" ? "user" : "model",
        parts: [{ text: msg.text }]
      }));
      contents.push({ role: "user", parts: [{ text: userPrompt }] });

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: contents })
        });
        const data = await response.json();
        if (data.candidates && data.candidates[0].content) {
          const replyText = data.candidates[0].content.parts[0].text;
          speakResponse(replyText);
          return replyText;
        } else {
          return "Sorry, I couldn't process that response.";
        }
      } catch (error) {
        return "Network connection error.";
      }
    }

    function appendMessageToUI(text, role, save = true) {
      if (!chat) return;
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "ai");
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      if (welcome) welcome.style.display = "none";

      if (save) {
        messages.push({ text, role });
        localStorage.setItem("snoop_messages", JSON.stringify(messages));
      }
    }

    async function handleSend(customText = null) {
      const textToSend = customText || (promptBox ? promptBox.value.trim() : "");
      if (!textToSend) return;

      appendMessageToUI(textToSend, "user");
      if (promptBox) promptBox.value = "";

      const tempDiv = document.createElement("div");
      tempDiv.className = "msg ai";
      tempDiv.textContent = "SNOOP AI is thinking...";
      chat.appendChild(tempDiv);
      chat.scrollTop = chat.scrollHeight;

      const aiReply = await sendToSnoopAI(textToSend);
      
      tempDiv.remove();
      appendMessageToUI(aiReply, "model");
    }

    function triggerTool(toolName) {
      const promptText = `Help me with ${toolName}: `;
      if (promptBox) {
        promptBox.value = promptText;
        promptBox.focus();
      }
    }

    function startNewChat() {
      messages = [];
      localStorage.removeItem("snoop_messages");
      const msgs = chat.querySelectorAll(".msg");
      msgs.forEach(m => m.remove());
      if (promptBox) promptBox.value = "";
      if (welcome) welcome.style.display = "block";
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Try Chrome.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.onresult = (e) => {
        const speechText = e.results[0][0].transcript;
        if (promptBox) promptBox.value = speechText;
        handleSend(speechText);
      };
      recognition.start();
    }

    function speakResponse(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
      }
    }

    if (promptBox) {
      promptBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
    }
document.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
